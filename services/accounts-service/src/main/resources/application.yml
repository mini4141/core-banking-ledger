server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: accounts-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/accounts?createDatabaseIfNotExist=true}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:20}
  jpa:
    open-in-view: ${JPA_OPEN_IN_VIEW:false}
    hibernate.ddl-auto: none
    properties:
      hibernate.jdbc.batch_size: ${JPA_BATCH_SIZE:25}
      hibernate.order_updates: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

ledger:
  cache:
    enabled: ${CACHE_ENABLED:true}

management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  metrics:
    tags.application: ${spring.application.name}
    distribution.percentiles-histogram.http.server.requests: true
  tracing.sampling.probability: 1.0

springdoc:
  swagger-ui.path: /swagger-ui
