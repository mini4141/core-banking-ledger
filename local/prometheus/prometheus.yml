global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: accounts-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["accounts-service:8081"] }]
  - job_name: transfer-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["transfer-service:8082"] }]
  - job_name: audit-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["audit-service:8083"] }]
