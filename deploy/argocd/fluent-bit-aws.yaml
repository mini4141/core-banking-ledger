apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluent-bit
    targetRevision: 0.53.0
    helm:
      values: |
        resources:
          requests: { cpu: 20m, memory: 48Mi }
        config:
          inputs: |
            [INPUT]
                Name              tail
                Path              /var/log/containers/*_core-banking_*.log
                multiline.parser  docker, cri
                Tag               kube.*
                Mem_Buf_Limit     5MB
          filters: |
            [FILTER]
                Name                kubernetes
                Match               kube.*
                Merge_Log           On
                Keep_Log            Off
                K8S-Logging.Parser  Off
                K8S-Logging.Exclude Off
          outputs: |
            [OUTPUT]
                Name                es
                Match               kube.*
                Host                __OPENSEARCH_ENDPOINT__
                Port                443
                tls                 On
                AWS_Auth            On
                AWS_Region          __AWS_REGION__
                Logstash_Format     On
                Logstash_Prefix     core-banking
                Suppress_Type_Name  On
                Replace_Dots        On
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
