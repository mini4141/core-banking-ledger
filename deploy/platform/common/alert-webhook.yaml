# Alertmanager webhook receiver: logs every alert notification body to stdout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-webhook
  namespace: monitoring
  labels: { app: alert-webhook }
spec:
  replicas: 1
  selector:
    matchLabels: { app: alert-webhook }
  template:
    metadata:
      labels: { app: alert-webhook }
    spec:
      containers:
        - name: echo
          image: mendhak/http-https-echo:37
          env:
            - { name: HTTP_PORT, value: "8080" }
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 10m, memory: 48Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: alert-webhook
  namespace: monitoring
spec:
  selector: { app: alert-webhook }
  ports:
    - port: 8080
