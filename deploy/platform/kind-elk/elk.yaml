# Lightweight single-node Elasticsearch + Kibana for kind (official Elastic images).
apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: logging
  labels: { app: elasticsearch }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: elasticsearch }
  template:
    metadata:
      labels: { app: elasticsearch }
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
          env:
            - { name: discovery.type, value: single-node }
            - { name: xpack.security.enabled, value: "false" }
            - { name: ES_JAVA_OPTS, value: "-Xms512m -Xmx512m" }
          ports:
            - containerPort: 9200
          readinessProbe:
            httpGet: { path: /_cluster/health, port: 9200 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            limits: { memory: 1280Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: logging
spec:
  selector: { app: elasticsearch }
  ports:
    - port: 9200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: logging
  labels: { app: kibana }
spec:
  replicas: 1
  selector:
    matchLabels: { app: kibana }
  template:
    metadata:
      labels: { app: kibana }
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.17.4
          env:
            - { name: ELASTICSEARCH_HOSTS, value: "http://elasticsearch:9200" }
            - { name: NODE_OPTIONS, value: "--max-old-space-size=512" }
          ports:
            - containerPort: 5601
          resources:
            requests: { cpu: 100m, memory: 768Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: logging
spec:
  selector: { app: kibana }
  ports:
    - port: 5601
